 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBU Online Teaching & Learning System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #1e4d8c; color: #333; }
        .nav { background: #002b5c; color: white; padding: 15px 25px; display: none; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .nav button { background: #00509e; color: white; border: none; padding: 9px 15px; margin: 3px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav button.active { background: #28a745; }
     
        .auth-box { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .main-box { max-width: 850px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; display: none; }
        h2 { color: #003366; text-align: center; margin-top: 0; }
        input, select { width: 100%; padding: 11px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-green { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: #004080; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #003366; color: white; }
        .join-btn { background: #28a745; color: white; padding: 6px 10px; text-decoration: none; border-radius: 4px; font-size: 13px; display: inline-block; }
    </style>
</head>
<body>

<div class="nav" id="topNav">
    <div><strong>🎓 OBU Online Teaching & Learning System</strong></div>
    <div>
        <button id="b-student" onclick="openPage('student')">Student Portal</button>
        <button id="b-instructor" onclick="openPage('instructor')">Instructor Portal</button>
        <button id="b-admin" onclick="openPage('admin')">Admin Panel</button>
        <button style="background:#dc3545;" onclick="logout()">Logout</button>
    </div>
</div>

<!-- 1. USER REGISTRATION / LOGIN -->
<div class="auth-box" id="authBox">
    <h2>User Registration</h2>
    <input type="text" id="uName" placeholder="Full Name (e.g., Dereje Bekele)">
    <input type="email" id="uEmail" placeholder="Email (e.g., bdereje382@gmail.com)">
    <input type="text" id="uDept" placeholder="Department (e.g., ECE)">
    <select id="uRole">
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
        <option value="admin">Admin</option>
    </select>
    <input type="password" id="uPass" placeholder="Password">
    <button type="button" class="btn-green" onclick="enterSystem()">Register & Enter System</button>
</div>

<!-- 2. MAIN SYSTEM DASHBOARD -->
<div class="main-box" id="mainBox">
    <div id="student" class="tab">
        <h2>Student Dashboard — Live Classes & Course Modules</h2>
        <table>
            <thead>
                <tr><th>Code</th><th>Course Title</th><th>Instructor</th><th>Live Class</th><th>Module</th></tr>
            </thead>
            <tbody id="courseList"></tbody>
        </table>
    </div>

    <div id="instructor" class="tab" style="display:none;">
        <h2>Instructor Dashboard — Publish Course & Live Link</h2>
        <input type="text" id="cCode" placeholder="Course Code (e.g., ECEg3101)">
        <input type="text" id="cName" placeholder="Course Title (e.g., Signals and Systems)">
        <input type="text" id="cInst" placeholder="Instructor Name">
        <input type="text" id="cLive" placeholder="Live Class Link (e.g., https://google.com)">
        <input type="text" id="cMod" placeholder="Module PDF / Drive Link (e.g., https://google.com)">
        <button type="button" class="btn-blue" onclick="addCourse()">Publish Course & Materials</button>
    </div>

    <div id="admin" class="tab" style="display:none;">
        <h2>Admin Panel — Registered Users</h2>
        <table>
            <thead>
                <tr><th>Full Name</th><th>Email</th><th>Dept</th><th>Role</th></tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
    </div>
</div>

<script>
    var courses = JSON.parse(localStorage.getItem("obu_c")) || [
        { code: "ECEg3101", name: "Object Oriented Programming", inst: "Dr. Tadesse", live: "https://google.com", mod: "https://google.com" },
        { code: "ECEg2141", name: "Signal and System Analysis", inst: "Mr. Gemechu", live: "https://zoom.us", mod: "https://google.com" }
    ];
    var users = JSON.parse(localStorage.getItem("obu_u")) || [
        { name: "Dereje Bekele", email: "bdereje382@gmail.com", dept: "ECE", role: "INSTRUCTOR" }
    ];

    function enterSystem() {
        var n = document.getElementById('uName').value.trim();
        var e = document.getElementById('uEmail').value.trim();
        var d = document.getElementById('uDept').value.trim() || "ECE";
        var r = document.getElementById('uRole').value;
        if (!n || !e) { alert("Please enter Name and Email!"); return; }

        users.push({ name: n, email: e, dept: d, role: r.toUpperCase() });
        localStorage.setItem("obu_u", JSON.stringify(users));

        document.getElementById('authBox').style.display = 'none';
        document.getElementById('topNav').style.display = 'flex';
        document.getElementById('mainBox').style.display = 'block';
        openPage(r);
    }

    function openPage(page) {
        var tabs = document.getElementsByClassName('tab');
        for (var i = 0; i < tabs.length; i++) tabs[i].style.display = 'none';
        document.getElementById(page).style.display = 'block';
        render();
    }

    function addCourse() {
        var c = document.getElementById('cCode').value.trim();
        var n = document.getElementById('cName').value.trim();
        var i = document.getElementById('cInst').value.trim() || "OBU Instructor";
        var l = document.getElementById('cLive').value.trim() || "https://google.com";
        var m = document.getElementById('cMod').value.trim() || "https://google.com";
        if (!c || !n) { alert("Please fill Course Code and Title!"); return; }
        if (l.indexOf("http") !== 0) l = "https://" + l;
        if (m.indexOf("http") !== 0) m = "https://" + m;

        courses.push({ code: c, name: n, inst: i, live: l, mod: m });
        localStorage.setItem("obu_c", JSON.stringify(courses));
        alert("Course Published Successfully!");
        openPage('student');
    }

    function logout() {
        document.getElementById('authBox').style.display = 'block';
        document.getElementById('topNav').style.display = 'none';
        document.getElementById('mainBox').style.display = 'none';
    }

    function render() {
        var ch = "";
        for (var i = 0; i < courses.length; i++) {
            ch += "<tr><td>" + courses[i].code + "</td><td>" + courses[i].name + "</td><td>" + courses[i].inst + "</td>" +
                  "<td><a class='join-btn' href='" + courses[i].live + "' target='_blank'>Join Live</a></td>" +
                  "<td><a class='join-btn' style='background:#00509e' href='" + courses[i].mod + "' target='_blank'>Open Module</a></td></tr>";
        }
        document.getElementById('courseList').innerHTML = ch;

        var uh = "";
        for (var j = 0; j < users.length; j++) {
            uh += "<tr><td>" + users[j].name + "</td><td>" + users[j].email + "</td><td>" + users[j].dept + "</td><td><strong>" + users[j].role + "</strong></td></tr>";
        }
        document.getElementById('userList').innerHTML = uh;
    }
</script>
</body>
</html>
